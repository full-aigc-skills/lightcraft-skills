name: native-platforms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'skills/**'
      - 'scripts/native_acceptance.py'
      - 'scripts/native-requirements.txt'
      - '.github/workflows/native-platforms.yml'
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, target: linux-aarch64}
          - {runner: ubuntu-24.04, target: linux-x86_64}
          - {runner: macos-15-intel, target: darwin-x86_64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: windows-2022, target: windows-x86_64, python_arch: x64}
          - {runner: windows-2022, target: windows-x86, python_arch: x86}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: runner.os != 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Verify checkout bytes match committed runtime
        run: |
          python -I -B - <<'PYCODE'
          import pathlib, subprocess
          for path in [pathlib.Path('scripts/native_acceptance.py'), *pathlib.Path('runtime').iterdir(), *pathlib.Path('skills/lightcraft-use/scripts').iterdir()]:
              if not path.is_file() or path.suffix not in ('.py', '.json', '.ts'):
                  continue
              relative=path.as_posix()
              committed=subprocess.check_output(['git','rev-parse','HEAD:'+relative],text=True).strip()
              observed=subprocess.check_output(['git','hash-object','--no-filters',relative],text=True).strip()
              assert observed==committed, relative
          PYCODE
      - name: Windows installer and process supervisor regression
        if: runner.os == 'Windows'
        run: |
          python -I -B -m unittest discover -s tests -p test_windows_installer.py -v
          python -I -B -m unittest discover -s tests -p test_portable_text.py -v
          python -I -B -m unittest discover -s tests -p test_windows_native_process.py -v
      - run: >-
          python -m pip install --only-binary=:all: --require-hashes -r scripts/native-requirements.txt
      - run: python -I -B scripts/validate_package.py
      - name: Execute fixed native photo workflow
        env:
          NATIVE_WORKDIR: ${{ runner.temp }}/native-${{ matrix.target }}
        run: python -I -B scripts/native_acceptance.py --allow-install --workdir "$NATIVE_WORKDIR"
      - name: Check actual runner identity
        env:
          NATIVE_WORKDIR: ${{ runner.temp }}/native-${{ matrix.target }}
        run: |
          python -I -B - <<'PY'
          import json, pathlib, os
          report=json.loads((pathlib.Path(os.environ['NATIVE_WORKDIR'])/'native-evidence.json').read_text(encoding='utf-8'))
          assert report['platform']=='${{ matrix.target }}', report['platform']
          assert report['nativeStatus']=='PASS'
          assert len(report['photos'])==2 and len(report['artifacts'])==6
          PY
      - name: Record POSIX binary signature and dependencies
        if: runner.os != 'Windows'
        env:
          NATIVE_WORKDIR: ${{ runner.temp }}/native-${{ matrix.target }}
        run: |
          binary="$NATIVE_WORKDIR/runtime/lightcraft/0.2.1/lightcraft-cli"
          uname -a > "$NATIVE_WORKDIR/posix-platform.txt"
          if [[ "$RUNNER_OS" == Linux ]]; then
            ldd "$binary" > "$NATIVE_WORKDIR/posix-dependencies.txt"
            if grep -q 'not found' "$NATIVE_WORKDIR/posix-dependencies.txt"; then exit 1; fi
            getconf GNU_LIBC_VERSION >> "$NATIVE_WORKDIR/posix-platform.txt"
            sha256sum "$binary" >> "$NATIVE_WORKDIR/posix-platform.txt"
          else
            otool -L "$binary" > "$NATIVE_WORKDIR/posix-dependencies.txt"
            codesign --verify --strict --verbose=2 "$binary" 2> "$NATIVE_WORKDIR/posix-signature.txt"
            codesign -d --verbose=4 "$binary" 2>> "$NATIVE_WORKDIR/posix-signature.txt"
            shasum -a 256 "$binary" >> "$NATIVE_WORKDIR/posix-platform.txt"
          fi
      - name: Record Windows signature and PE dependencies
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          NATIVE_WORKDIR: ${{ runner.temp }}/native-${{ matrix.target }}
        run: |
          $binary = Join-Path $env:NATIVE_WORKDIR 'runtime/lightcraft/0.2.1/lightcraft-cli.exe'
          if (!(Test-Path $binary)) { throw 'native CLI not installed; dependency evidence unavailable' }
          $signature = Get-AuthenticodeSignature -FilePath $binary
          $facts = @{ hostOS = [Environment]::OSVersion.VersionString; hostArchitecture = $env:PROCESSOR_ARCHITECTURE; status = $signature.Status.ToString(); statusMessage = $signature.StatusMessage; signerSubject = $signature.SignerCertificate.Subject; binarySha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower() }
          $facts | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:NATIVE_WORKDIR 'windows-signature.json') -Encoding utf8
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'PE dependency inspection tool unavailable' }
          & $dumpbin /dependents $binary | Set-Content (Join-Path $env:NATIVE_WORKDIR 'windows-dependencies.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'PE dependency inspection failed' }
      - name: Preserve exact native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-${{ matrix.target }}/native-evidence.json
            ${{ runner.temp }}/native-${{ matrix.target }}/windows-*.json
            ${{ runner.temp }}/native-${{ matrix.target }}/windows-*.txt
            ${{ runner.temp }}/native-${{ matrix.target }}/posix-*.txt
            ${{ runner.temp }}/native-${{ matrix.target }}/*-plan.json
            ${{ runner.temp }}/native-${{ matrix.target }}/*/receipt.json
            ${{ runner.temp }}/native-${{ matrix.target }}/*/logs/*.log
            ${{ runner.temp }}/native-${{ matrix.target }}/*/logs/*.json
            ${{ runner.temp }}/native-${{ matrix.target }}/*/native-plan.json
            ${{ runner.temp }}/native-${{ matrix.target }}/exports/*
            ${{ runner.temp }}/native-${{ matrix.target }}/originals/*
          if-no-files-found: error
          retention-days: 30
